# ==============================================================================
# Pipeline de Integración Continua (CI) — SGD-AVEIT
# ==============================================================================
name: SGD-AVEIT CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-ci:
    name: Backend Quality & Tests (Python 3.10 / Django 4.2 / MySQL 8.0)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: aveit_tribunal_test
          MYSQL_USER: aveit_test
          MYSQL_PASSWORD: test_password_ci_2026
          MYSQL_ROOT_PASSWORD: test_root_ci_2026
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias binarias del sistema (MySQL Client)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config gcc

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verificación de linting con Ruff
        run: ruff check backend/

      - name: Verificación de formateo con Ruff
        run: ruff format --check backend/

      - name: Ejecutar suite de pruebas con Pytest
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          DJANGO_SECRET_KEY: ci-test-secret-key-do-not-use-in-production-2026
          DJANGO_DEBUG: "False"
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: aveit_tribunal_test
          DATABASE_USER: aveit_test
          DATABASE_PASSWORD: test_password_ci_2026
        run: pytest backend/ -v

  frontend-ci:
    name: Frontend Quality & Build (Node 18 / Angular 14)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias de frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps

      # NOTA: Omitido temporalmente hasta migrar de TSLint legado a @angular-eslint
      # - name: Linting de código TypeScript / Angular
      #   run: |
      #     cd frontend
      #     npm run lint

      # NOTA: Se ejecuta para trazabilidad pero con continue-on-error mientras se sanean los specs legados de la plantilla
      - name: Ejecutar pruebas unitarias headless
        continue-on-error: true
        run: |
          cd frontend
          npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Compilar aplicación para producción
        run: |
          cd frontend
          npm run build
