# Entorno independiente para SCRUM-77. Invocar con este archivo como único -f.
name: sgd-aveit-scrum77-demo

services:
  db:
    image: mysql:8.0
    container_name: sgd_aveit_scrum77_demo_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: aveit_tribunal_scrum77_demo
      MYSQL_USER: aveit_dev
      MYSQL_PASSWORD: ${SCRUM77_MYSQL_PASSWORD:-aveit_scrum77_demo_password}
      MYSQL_ROOT_PASSWORD: ${SCRUM77_MYSQL_ROOT_PASSWORD:-aveit_scrum77_demo_root_password}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgd_aveit_scrum77_demo_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./docs:/docs:ro
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      DJANGO_SETTINGS_MODULE: core.settings
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ${SCRUM77_DJANGO_SECRET_KEY:-django-insecure-scrum77-demo-only}
      USE_SQLITE: "False"
      PADRON_ADAPTER: database
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_NAME: aveit_tribunal_scrum77_demo
      DATABASE_USER: aveit_dev
      DATABASE_PASSWORD: ${SCRUM77_MYSQL_PASSWORD:-aveit_scrum77_demo_password}
      CORS_ALLOWED_ORIGINS: http://localhost:4202,http://127.0.0.1:4202
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health/\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    profiles: [frontend]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sgd_aveit_scrum77_demo_frontend
    restart: unless-stopped
    command: npm start -- --host 0.0.0.0 --port 4200 --poll 2000 --proxy-config proxy.docker.conf.json
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:4202:4200"
    environment:
      NODE_ENV: development
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
    name: sgd_aveit_scrum77_demo_mysql_data
  frontend_node_modules:
    name: sgd_aveit_scrum77_demo_frontend_node_modules
