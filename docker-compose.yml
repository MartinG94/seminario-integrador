version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sgd_aveit_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: aveit_tribunal_dev
      MYSQL_USER: aveit_dev
      MYSQL_PASSWORD: aveit_dev_password_2026
      MYSQL_ROOT_PASSWORD: aveit_root_secure_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "aveit_dev", "-paveit_dev_password_2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgd_aveit_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "1"
      DJANGO_SETTINGS_MODULE: "core.settings"
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_NAME: aveit_tribunal_dev
      DATABASE_USER: aveit_dev
      DATABASE_PASSWORD: aveit_dev_password_2026
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sgd_aveit_frontend
    restart: unless-stopped
    command: npm start -- --host 0.0.0.0 --port 4200
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      NODE_ENV: development
    depends_on:
      - backend

volumes:
  mysql_data:
    name: sgd_aveit_mysql_data
