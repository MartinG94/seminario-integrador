
services:
  db:
    image: mysql:8.0
    container_name: sgd_aveit_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aveit_tribunal_dev}
      MYSQL_USER: ${MYSQL_USER:-aveit_dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aveit_dev_password_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aveit_root_secure_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgd_aveit_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-core.settings}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      DATABASE_HOST: ${MYSQL_HOST:-db}
      DATABASE_PORT: ${MYSQL_PORT:-3306}
      DATABASE_NAME: ${MYSQL_DATABASE:-aveit_tribunal_dev}
      DATABASE_USER: ${MYSQL_USER:-aveit_dev}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-aveit_dev_password_2026}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health/\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sgd_aveit_frontend
    restart: unless-stopped
    command: npm start -- --host 0.0.0.0 --port 4200 --poll 2000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      NODE_ENV: development
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
    name: sgd_aveit_mysql_data
