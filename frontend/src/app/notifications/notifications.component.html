<div class="main-content">
  <div class="container-fluid">
    <div class="card">
      <div class="card-header card-header-primary">
        <h3 class="card-title">Notificaciones</h3>
      </div>
      <div class="card-body">
        <p>Los avisos aparecen abajo a la derecha durante 10 segundos. También podés cerrarlos con la X.</p>
        <p>Probá cada tipo de notificación:</p>
        <button *ngFor="let example of examples" type="button" class="btn btn-primary"
          (click)="showNotification(example.type, example.message)">{{ example.label }}</button>
      </div>
    </div>
  </div>
</div>
