<div class="dialog-container">
  <div class="dialog-header">
    <div class="header-icon-wrapper">
      <mat-icon class="header-icon">event_repeat</mat-icon>
    </div>
    <div>
      <h3 class="dialog-title">Nueva Versión de Calendario Institucional</h3>
      <p class="dialog-subtitle">Control de versiones y auditoría de días hábiles (CA2)</p>
    </div>
  </div>

  <div class="dialog-body">
    <div *ngIf="errorMensaje" class="alert alert-danger" role="alert">
      {{ errorMensaje }}
    </div>

    <div class="form-group mb-3">
      <label class="input-label">Nombre descriptivo de la versión <span class="required">*</span></label>
      <input type="text" class="form-control custom-input" [(ngModel)]="nombre" placeholder="Ej. Calendario Oficial AVEIT 2026 - v2">
    </div>

    <div class="row">
      <div class="col-md-6 form-group mb-3">
        <label class="input-label">Vigencia Desde <span class="required">*</span></label>
        <input type="date" class="form-control custom-input" [(ngModel)]="vigenciaDesde">
      </div>
      <div class="col-md-6 form-group mb-3">
        <label class="input-label">Vigencia Hasta (opcional)</label>
        <input type="date" class="form-control custom-input" [(ngModel)]="vigenciaHasta">
      </div>
    </div>

    <div class="form-group mb-3">
      <div class="form-check">
        <label class="form-check-label check-label">
          <input class="form-check-input" type="checkbox" [(ngModel)]="clonarFeriados">
          Clonar feriados de la versión previa
          <span class="form-check-sign"><span class="check"></span></span>
        </label>
      </div>
      <div *ngIf="clonarFeriados" class="mt-2 ml-4">
        <label class="input-label text-muted">Versión base para clonar:</label>
        <select class="form-control custom-select" [(ngModel)]="versionBaseId">
          <option *ngFor="let v of data.versionesDisponibles" [ngValue]="v.version">
            v{{ v.version }} - {{ v.nombre }} ({{ v.feriados_count }} feriados)
          </option>
        </select>
      </div>
    </div>

    <div class="form-group mb-3">
      <div class="form-check">
        <label class="form-check-label check-label">
          <input class="form-check-input" type="checkbox" [(ngModel)]="activa">
          Establecer como versión activa para nuevos cómputos de plazos (CA3)
          <span class="form-check-sign"><span class="check"></span></span>
        </label>
      </div>
    </div>

    <div class="form-group mb-3">
      <label class="input-label">Motivo formal de auditoría del cambio <span class="required">*</span></label>
      <textarea
        class="form-control custom-textarea"
        rows="3"
        [(ngModel)]="motivoCambio"
        placeholder="Describa el fundamento administrativo de la nueva versión (ej. Decreto nacional de feriado puente, asueto académico UTN FRC, resolución de Comisión Directiva)...">
      </textarea>
      <small class="form-text text-muted">
        Este texto quedará registrado de forma inalterable en el historial de auditoría de la institución.
      </small>
    </div>
  </div>

  <div class="dialog-actions">
    <button mat-button class="btn btn-secondary mr-2" (click)="cancelar()">
      Cancelar
    </button>
    <button mat-raised-button class="btn btn-primary" (click)="guardar()">
      <mat-icon class="mr-1">save</mat-icon> Publicar Versión
    </button>
  </div>
</div>
